
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taskly — Get things done{% endblock %}</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --background: #f9fafb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            color: var(--text);
            background: var(--background);
        }

        a {
            text-decoration: none;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-user {
            color: var(--muted);
            font-size: 14px;
        }

        .nav-login {
            color: var(--text);
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            color: white;
            background: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            color: var(--text);
            background: white;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        main {
            min-height: calc(100vh - 70px);
        }

        @media (max-width: 600px) {
            .nav-container {
                padding: 14px 20px;
                gap: 12px;
            }

            .nav-actions {
                gap: 10px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .nav-user {
                display: none;
            }

            .brand {
                font-size: 21px;
            }

            .container {
                padding-left: 20px;
                padding-right: 20px;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>

<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="brand">Taskly</a>

            <div class="nav-actions">
                {% if request.session.user_id %}
                    <a href="{% url 'tasks' %}" class="btn btn-primary">
                        My Tasks
                    </a>

                    <span class="nav-user">
                        Welcome back, {{ user_name }}!
                    </span>

                    <form method="post"
                          action="{% url 'logout' %}"
                          style="margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-secondary">
                            Log out
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="nav-login">
                        Log in
                    </a>

                    <a href="{% url 'register' %}" class="btn btn-primary">
                        Get started
                    </a>
                {% endif %}
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
